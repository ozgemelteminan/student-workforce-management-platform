services:
  api:
    build:
      context: .
      dockerfile: backend/src/StudentWorkforceManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=student_workforce;Username=student_workforce;Password=student_workforce_dev_password
      REDIS_CONNECTION_STRING: redis:6379
      DISPLAY_TIMEZONE: Europe/Istanbul
      MAX_FILE_SIZE_BYTES: 1073741824
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: student_workforce
      POSTGRES_USER: student_workforce
      POSTGRES_PASSWORD: student_workforce_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_workforce -d student_workforce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
